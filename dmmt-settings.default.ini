# Dungeon Master Map Tool settings
# Edit this file with any text editor. Lines are 'key = value'; lines starting with # are comments.
# Edits made while the application runs are picked up when its window regains focus; entries marked
# 'Restart required' (and the window/panel/player/fog/text values the app itself changes) are read at startup.
# Delete a line to fall back to the built-in default. Invalid values are ignored, numbers are clamped to their range.
# Every entry is explained in docs/SETTINGS.md of the project.

# ---- Window and panels ----
# Show the sidebar (true/false).
ui.sidebarVisible = true
# Show the toolbar controls (true/false).
ui.controlsExpanded = true
# Performance mode for slow machines (true/false); see the Performance mode section.
ui.performanceMode = false
# Animate effect textures and weather on all maps (true/false).
ui.effectAnimations = true
# Light flicker on / off for all maps (true/false); lights flicker according to their own flicker setting while on.
ui.lightFlicker = true
# DM controls tabs that are hidden from the overlay, comma separated ids: tools, fog, lighting, weather, effects, text, building, player, performance. Empty = all tabs shown.
ui.sections.hidden = 
# Individual DM controls hidden from the overlay, comma separated section.control ids. Empty = all controls shown. Configure in Settings > DM controls tabs; values and shortcuts are unchanged.
ui.controls.hidden = 
# Number of maps kept in the recent maps list below the map library (1 to 30).
ui.recentMaps.max = 5
# Recently opened maps, most recent first, separated by '|' (managed by the app).
# ui.recentMaps = 
# Initial width of the main (DM) window in pixels. (400 to 10000) Restart required.
window.dmWidth = 1500
# Initial height of the main (DM) window in pixels. (300 to 10000) Restart required.
window.dmHeight = 920

# ---- Collapsible sidebar sections (true = expanded) ----
ui.section.tools.expanded = true
ui.section.fog.expanded = true
ui.section.lighting.expanded = true
ui.section.effects.expanded = true
ui.section.text.expanded = true
ui.section.building.expanded = true
ui.section.player.expanded = true
ui.section.performance.expanded = true

# ---- Player screen ----
# Index of the monitor used for the player view.
player.screenIndex = 0
# Physical size of one grid tile on the player screen, in inches.
player.tileInches = 1.0
# Show grid lines over the player map (true/false); does not affect the DM view.
player.showGrid = false
# Screen diagonal per monitor index in inches, e.g. player.screenDiagonalInches.1 = 27.
# player.screenDiagonalInches.0 = 
# Automatically pan the DM view near map edges while dragging the player viewport title bar. (true/false)
player.viewportEdgeScroll.enabled = true
# Width of the player viewport drag edge zone in logical pixels. (1 to 300)
player.viewportEdgeScroll.zonePx = 40
# Maximum DM pan speed during a player viewport drag in logical pixels per second (also caps diagonal speed). (1 to 3000)
player.viewportEdgeScroll.maxSpeedPxPerSecond = 600
# Lowest value of the player zoom slider as a power of two (-2 = 25 %). (-6 to 0) Restart required.
player.zoom.minStep = -2
# Highest value of the player zoom slider as a power of two (2 = 400 %). (0 to 6) Restart required.
player.zoom.maxStep = 2
# Player zoom change per mouse wheel notch with Ctrl held over the DM view. (1.01 to 4)
player.zoom.wheelFactor = 1.1
# How far Ctrl+wheel zoom-in pulls the player view towards the cursor (0 = not at all, 1 = centre on cursor). (0 to 1)
player.zoom.cursorPull = 0.4
# Absolute lower limit of the calibrated player camera zoom. (0.001 to 1)
player.zoom.min = 0.02
# Absolute upper limit of the calibrated player camera zoom. (1 to 1000)
player.zoom.max = 48
# Smallest value of the 'Tile size (in)' field. (0.05 to 10) Restart required.
player.tileInches.min = 0.25
# Largest value of the 'Tile size (in)' field. (0.1 to 20) Restart required.
player.tileInches.max = 3
# Smallest value of the 'Screen diagonal (in)' field and of the DPI based estimate. (1 to 100) Restart required.
player.screenDiagonal.min = 10
# Largest value of the 'Screen diagonal (in)' field and of the DPI based estimate. (10 to 1000) Restart required.
player.screenDiagonal.max = 120
# Screen diagonal in inches used when the field has no value. (1 to 1000)
player.screenDiagonal.fallback = 27

# ---- Fog and lighting ----
# Fog cells per grid cell (edge sharpness of fog of war), fog.cellsPerGrid.min to fog.cellsPerGrid.max.
fog.cellsPerGrid = 10
# Width of the soft fog edge in grid tiles (0 = hard edge, max fog.softness.max).
fog.softness = 0.3
# Fade fog in and out when it is revealed or hidden (true/false).
fog.fadeAnimation = true
# Lowest fog sharpness (fog cells per tile); also the resolution performance mode draws fog at. (1 to 100) Restart required.
fog.cellsPerGrid.min = 5
# Highest fog sharpness (fog cells per tile). (1 to 200) Restart required.
fog.cellsPerGrid.max = 30
# Upper limit of the fog softness slider in tiles. (0 to 5) Restart required.
fog.softness.max = 1
# Seconds fog needs to fade out completely when it is revealed by a tool. (0.01 to 30)
fog.revealSeconds = 0.5
# Seconds fog needs to fade in completely when it is hidden by a tool. (0.01 to 30)
fog.hideSeconds = 0.5
# Fade time in seconds when fog changes because of a light or door (short, so moving lights do not trail). (0.01 to 30)
fog.lightFadeSeconds = 0.16
# Longest time step one frame may advance a fog fade (prevents jumps after a stall). (0.01 to 2)
fog.fadeMaxStepSeconds = 0.1
# Shape of the fog fade: constant speed, or slow start and end. (linear or smooth)
fog.fadeEasing = linear
# Opacity of fully fogged areas in the DM view (players always see 1). (0 to 1)
fog.dmOpacity = 0.58

# ---- Frame rates ----
# Frame rate while interacting with the map (1 to render.maxFps).
render.targetFps = 60
# Frame rate while only effect textures or light flicker move (capped by targetFps).
render.animationFps = 30
# Frame rate when nothing moves and there was no input for input.recentInputMs.
render.idleFps = 10
# Upper limit for all frame rate settings. (1 to 1000) Restart required.
render.maxFps = 240

# ---- Auto-save ----
# Save the project automatically (true/false).
autosave.enabled = true
# Minutes between automatic saves.
autosave.minutes = 2
# Interval choices (in minutes) of the auto-save menu. Comma separated, each 1 to 1440. Restart required.
autosave.minuteOptions = 1, 2, 5, 10
# How often in seconds the auto-save timer checks whether a save is due. (1 to 600) Restart required.
autosave.checkSeconds = 10

# ---- Text defaults ----
# Default font size of new text labels.
text.fontSize = 32
# Default text colour.
text.textColor = #1E1E1E
# Default text background colour.
text.backgroundColor = #EEEEEE
# Default text border colour.
text.borderColor = #00000000
# Global rotation of all text boxes on the player view in degrees: 0, 90, 180 or 270 (independent of the map rotation).
text.rotation = 0
# Font size of newly created DM-only room labels. (1 to 2000)
roomLabel.fontSize = 30
# Text colour of newly created DM-only room labels. (#RRGGBB)
roomLabel.textColor = #EEEEEE
# Background colour of newly created room labels, including alpha (#RRGGBB or #RRGGBBAA).
roomLabel.backgroundColor = #1E1E1E99
# Border colour of newly created room labels, including alpha (#RRGGBB or #RRGGBBAA).
roomLabel.borderColor = #00000000
# Opacity of text boxes hidden from players, as drawn in the DM view. (0 to 1)
text.dmHiddenOpacity = 0.85
# Smallest font size of the font size field. (1 to 100) Restart required.
text.minFontSize = 6
# Largest font size of the font size field. (10 to 2000) Restart required.
text.maxFontSize = 400
# Widest an auto-sized text box grows before wrapping, in grid cells. (1 to 200)
text.autoMaxWidthCells = 12
# Smallest width and height of a text box in map pixels; also the size of a box created by a plain click. (5 to 1000)
text.minBoxSize = 40

# ---- Import ----
# Folder last used when importing a map image.
import.lastDirectory = 
# Create numbered DM-only labels for enclosed rooms when importing dd2vtt/uvtt maps. (true/false)
import.autoLabelRooms = true
# Flicker depth given to lights imported from dd2vtt/uvtt files (0 = flicker off). (0 to 1)
import.dd2vtt.lightFlicker = 0.22
# Flicker speed given to lights imported from dd2vtt/uvtt files. (0.05 to 20)
import.dd2vtt.lightFlickerSpeed = 1.4
# Batch imports merge files that look like the levels of one building into a multilevel map (false = every file becomes its own map). (true/false)
import.autoMergeMultiLevel = true
# What to do when an imported file's original file name already exists in the library: ask every time, always import duplicates without asking, or never import duplicates without asking. (ask or always or never)
import.duplicateBehavior = ask

# ---- Audio ----
# Master volume of all audio (0 to 1); changed with the slider in the audio overlay.
audio.masterVolume = 0.8
# Volume of the category music (0 to 1); changed with the slider in the audio overlay.
audio.musicVolume = 0.7
# Volume of the sound effects (0 to 1); changed with the slider in the audio overlay.
audio.effectsVolume = 0.6
# Id of the music category last played in the audio overlay (managed by the app).
# audio.lastCategory = 
# Folder last used when importing audio files.
audio.lastDirectory = 
# Enable the audio feature (ambient music and sound effects). When off, the status bar transport group, the audio overlay, their API endpoints and the whole audio engine stay unloaded. (true/false) Restart required.
audio.enabled = true
# Folder of the audio library (imported music and sound effects). Relative paths start next to the settings file. Restart required.
audio.folder = dmmap-audio
# Play the tracks of a music category in random order (false = alphabetical order). (true/false)
audio.shuffle = true
# Seconds of the preloaded, equal-power music crossfade used for every automatic music transition: the next song, a single-song category repeating and Loop current song (0 = hard cut). Limited to half the ending track; independent of audio.effectLoopCrossfadeSeconds. (0 to 30)
audio.musicCrossfadeSeconds = 4
# Seconds a sound effect fades in when it is started and out when it is stopped. (0 to 30)
audio.effectFadeSeconds = 1.5
# Seconds consecutive repetitions of a sound effect overlap to mask restart gaps (0 = no overlap). Limited to half the clip length. (0 to 5)
audio.effectLoopCrossfadeSeconds = 0.5
# How often per second active sound effects and pending or running music crossfades are updated, independently of the audio readout. Higher values make blends smoother. (1 to 60) Restart required.
audio.effectLoopUpdateFps = 30
# Seconds the mute button in the audio overlay needs to fade all audio to silence and back. (0 to 10)
audio.panicFadeSeconds = 1
# Sound effects that may loop at the same time; starting one more stops the oldest. Lower this on slow machines. (1 to 64)
audio.maxEffects = 32
# How often per second fades and the now-playing readout are updated. Higher values make fades smoother and cost a little more CPU. (1 to 60)
audio.updateFps = 4
# How long the audio overlay takes to fade in and out when it is opened from the status bar (0 = show it instantly). (0 to 2)
audio.overlayFadeSeconds = 0.15
# Length of one analysed frame of the waveform in the cut window. Smaller values show finer detail, detect gaps more precisely and use more memory. (5 to 500)
audio.waveformFrameMs = 50
# Derive the silence level of the song detection from each file instead of using the fixed audio.cut.silenceDb. (true/false)
audio.cut.autoThreshold = true
# How far below the level of the music the automatic silence threshold sits. Lower values split more eagerly. (6 to 60)
audio.cut.dropDb = 26
# Fixed level below which the cut window treats audio as silence; only used when audio.cut.autoThreshold is off. (-90 to 0)
audio.cut.silenceDb = -45
# How much quieter than the surrounding music a gap must be to count as the border between two songs. Higher values reject more false positives. (0 to 60)
audio.cut.minGapDropDb = 18
# Seconds of silence that must pass before the cut window treats it as a gap between two songs. A shorter gap still counts when the music runs uninterrupted for a minute either side of it. (0.1 to 60)
audio.cut.minSilenceSeconds = 1.5
# Shortest detected song the cut window proposes as a clip; shorter sections between two gaps are ignored. (1 to 3600)
audio.cut.minTrackSeconds = 20
# Also propose a border where the music changes character, so recordings whose songs fade into each other without a gap can be split. (true/false)
audio.cut.detectChanges = true
# Seconds of audio compared before and after each moment when looking for a change of character, and the closest two such borders can be. Longer windows find only large-scale borders. (5 to 300)
audio.cut.changeWindowSeconds = 45
# How much a change of character must stand out from the rest of the file to become a border. Lower values propose more songs. (0.5 to 20)
audio.cut.changeSensitivity = 5
# Recognise a recording that is one piece repeated back to back and propose that piece once instead of leaving the whole file as a single clip. (true/false)
audio.cut.detectLoops = true
# How close to the border of the highlighted range in the cut window the mouse must be to drag that border instead of starting a new selection. (1 to 40)
audio.cut.edgeGrabPixels = 6

# ---- Local control API ----
# Enable the LAN-accessible HTTP API for external control devices and local automation. (true/false)
api.enabled = false
# TCP port of the local control API, bound to all IPv4 interfaces. (1024 to 65535)
api.port = 7071
# Address used in copied API URLs: network uses the LAN IP; local uses 127.0.0.1. Does not restrict network access. (network or local)
api.copyAddress = network
# Show API and key-image URL copy options in right-click menus. (true/false)
api.showUrlOptions = false

# ---- DM view navigation ----
# Furthest the DM view can zoom out. (0.001 to 1)
dm.zoom.min = 0.03
# Closest the DM view can zoom in. (1 to 100)
dm.zoom.max = 6
# DM zoom change per mouse wheel notch (zooming out divides by the same factor). (1.01 to 4)
dm.zoom.wheelFactor = 1.1

# ---- Mouse and selection ----
# Screen distance in pixels within which a click selects, removes or hovers a light. (1 to 200)
input.lightPickRadiusPx = 24
# Grab distance in pixels of the resize corner of an image layer. (1 to 200)
input.layerHandleRadiusPx = 16
# Grab distance in pixels of the resize handle of an effect shape. (1 to 200)
input.shapeHandleRadiusPx = 12
# Grab distance in pixels of the eight resize handles of a text box. (1 to 200)
input.textHandleRadiusPx = 9
# Click tolerance in pixels for door/window lines and for erasing walls. (1 to 200)
input.wallPickRadiusPx = 10
# Extra click tolerance in pixels around freehand, pen and line effects. (0 to 200)
input.shapePickRadiusPx = 6
# Mouse movement in pixels before a drag on empty map becomes a selection box. (0 to 200)
input.marqueeMinDragPx = 4
# Largest mouse movement in pixels for a right-click to still cancel the tool instead of panning. (0 to 200)
input.rightClickMaxMovePx = 5
# Repeated clicks on the same door within this many milliseconds are ignored (mouse switch bounce). (0 to 2000)
input.doorDebounceMs = 60
# Milliseconds after the last input during which the target frame rate is kept before dropping to idle. (0 to 60000)
input.recentInputMs = 1000

# ---- Ping and laser pointer ----
# How long a ping animation lasts in milliseconds. (100 to 60000)
ping.durationMs = 1200
# Radius of the ping ring in screen pixels when it appears. (0 to 500)
ping.startRadiusPx = 10
# How many pixels the ping ring grows over its lifetime. (0 to 2000)
ping.growPx = 50
# Colour of the ping ring and centre dot. (#RRGGBB)
ping.color = #FFE633
# How long the laser pointer trail stays visible in milliseconds. (0 to 10000)
laser.trailMs = 500
# Radius of the laser dot in the DM view in pixels. (1 to 100)
laser.dmDotPx = 6
# Radius of the laser dot on the player screen in physical inches. (0 to 5)
laser.playerDotInches = 0.15
# Smallest radius of the laser dot on the player screen in pixels. (1 to 200)
laser.playerDotMinPx = 6
# Colour of the laser pointer dot and trail. (#RRGGBB)
laser.color = #FF1A1A

# ---- Editing, brush and effects ----
# Number of undo steps kept. (1 to 10000)
history.maxSteps = 10
# Brush size in tiles when the application starts. (0.1 to 200) Restart required.
brush.defaultSizeTiles = 1.5
# Smallest brush size of the brush slider in tiles. (0.05 to 10) Restart required.
brush.minTiles = 0.2
# Largest brush size of the brush slider in tiles. (0.5 to 200) Restart required.
brush.maxTiles = 8
# Colour of new effect shapes until a texture or colour is picked. (#RRGGBB) Restart required.
effects.defaultColor = #55AA33
# Opacity of new effect shapes until a texture or opacity is picked. (0.1 to 1) Restart required.
effects.defaultOpacity = 0.4
# Line width of the Pen tool in grid cells. (0.005 to 2)
effects.penWidthCells = 0.06
# Opacity factor of effects hidden from players, as drawn in the DM view. (0 to 1)
effects.dmHiddenOpacity = 0.35
# Resolution of soft effects (fire, smoke, ...) relative to the screen; lower is faster and slightly blurrier. (0.1 to 1)
effects.softResolution = 0.5

# ---- Lights ----
# Upper limit of the light tint slider. (0 to 1) Restart required.
lighting.tint.max = 0.3
# Upper limit of the light bright core slider. (0 to 1) Restart required.
lighting.brightCore.max = 0.5
# Radius of each light's bright core highlight, as a fraction of the light's own range. (0.05 to 1)
lighting.brightCore.radius = 0.3
# Share of the time-of-day darkness shown in the DM view (players get all of it). (0 to 1)
lighting.dmDarknessFactor = 0.65
# Light map resolution divisor: the lighting is computed at 1/N of the screen resolution. (1 to 32)
lighting.lightMapScale = 4
# Pixel budget of one light map: on large screens the divisor is raised until the light map has at most this many pixels. (1000 to 8000000)
lighting.lightMapMaxPixels = 20000
# Rays per light for line of sight and shadows; more gives rounder light circles. (8 to 1024) Restart required.
lighting.shadowRays = 96
