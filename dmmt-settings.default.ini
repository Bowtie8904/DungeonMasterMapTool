# Default lightning interval in seconds for new maps and slider reset; independent of rain intensity. (2 to 120)
weather.thunderstorm.defaultIntervalSeconds = 7
# Duration of each lightning burst in seconds, including closely clustered flashes and their lingering fade-out. (0.2 to 1.5)
weather.thunderstorm.flashDurationSeconds = 0.7
# Lightning strength lifting ambient darkness; 1 fully lights the map at the flash peak, never revealing fog. (0 to 1)
weather.thunderstorm.flashBrightness = 1
# Peak opacity of the lightning highlight above the map and below fog and text. (0 to 1)
weather.thunderstorm.flashOpacity = 0.25
# Colour of the screen-wide lightning highlight. (#RRGGBB)
weather.thunderstorm.flashColor = #E8EEFF
# Rain: particles at full intensity on a 1920x1080 screen. (0 to 10000)
weather.rain.particles = 600
# Rain: particle colour. (#RRGGBB)
weather.rain.color = #C8D7EB
# Rain: highest particle opacity. (0 to 1)
weather.rain.opacity = 0.42
# Snow: particles at full intensity on a 1920x1080 screen. (0 to 10000)
weather.snow.particles = 610
# Snow: particle colour. (#RRGGBB)
weather.snow.color = #F5F8FF
# Snow: highest particle opacity. (0 to 1)
weather.snow.opacity = 0.5
# Mist (particles = fog banks): particles at full intensity on a 1920x1080 screen. (0 to 500)
weather.mist.particles = 70
# Mist (particles = fog banks): particle colour. (#RRGGBB)
weather.mist.color = #DBE3ED
# Mist (particles = fog banks): highest particle opacity. (0 to 1)
weather.mist.opacity = 0.12
# Dust motes: particles at full intensity on a 1920x1080 screen. (0 to 10000)
weather.dust.particles = 500
# Dust motes: particle colour. (#RRGGBB)
weather.dust.color = #FFF0CD
# Dust motes: highest particle opacity. (0 to 1)
weather.dust.opacity = 0.48
# Embers: particles at full intensity on a 1920x1080 screen. (0 to 10000)
weather.embers.particles = 295
# Embers: particle colour. (#RRGGBB)
weather.embers.color = #FF963C
# Embers: highest particle opacity. (0 to 1)
weather.embers.opacity = 0.75
# Thunderstorm rain: particles at full intensity on a 1920x1080 screen. (0 to 10000)
weather.thunderstorm.particles = 600
# Thunderstorm rain: particle colour. (#RRGGBB)
weather.thunderstorm.color = #C8D7EB
# Thunderstorm rain: highest particle opacity. (0 to 1)
weather.thunderstorm.opacity = 0.42

# ---- Performance mode ----
# Frame rate while interacting with the map in performance mode (never above render.targetFps). (1 to 240)
performance.interactionFps = 20
# Frame rate when nothing moves in performance mode (render.idleFps is used if lower). (1 to 240)
performance.idleFps = 5
# Frame rate of moving effect textures and weather in performance mode. (1 to 240)
performance.animationFps = 10
# Light map resolution divisor in performance mode (see lighting.lightMapScale). (1 to 32)
performance.lightMapScale = 8
# Most soft-edge passes of effect textures in performance mode. (1 to 24)
performance.maxFeatherPasses = 6
# How many detail levels coarser map images are drawn in performance mode (each level halves the resolution). (0 to 8)
performance.imageLevelBias = 2
# Keep fading fog in and out while performance mode is on. (true/false)
performance.fogFade = false

# ---- Storage and caches ----
# Background work policy: session uses one audio preparation worker; preparation uses two. Image preparation stays single-worker and file copying is limited to two workers. (session or preparation)
work.mode = session
# Folder of the map library. Relative paths start next to the settings file. Restart required.
library.folder = dmmap-projects
# Map image tiles kept in memory (each up to cache.imageTileSize squared pixels). (8 to 4096)
cache.imageTiles = 96
# Most image tile loads waiting at once; older requests are dropped when panning fast. (4 to 4096)
cache.imageTileLoadQueue = 48
# Unused image caches on disk are deleted after this many days. (1 to 3650) Restart required.
cache.retentionDays = 60
# Edge length in pixels of the tiles of large map images. Changing it rebuilds the image caches. (256 to 4096)
cache.imageTileSize = 1024
# Images up to this many pixels per side are drawn directly; larger ones get a tile pyramid. Changing it rebuilds the image caches. (512 to 8192)
cache.overviewMaxSize = 4096
# JPEG quality of cached image tiles. Changing it rebuilds the image caches. (0.1 to 1)
cache.jpegQuality = 0.92
# Generated effect texture tiles (one per texture and colour) kept in memory. (8 to 4096)
cache.textureTiles = 128

# ---- User interface ----
# Milliseconds the mouse must rest on a control before its tooltip appears. (0 to 10000) Restart required.
ui.tooltipDelayMs = 300
# Seconds a tooltip stays visible. (1 to 600) Restart required.
ui.tooltipDurationSeconds = 12
# Milliseconds a dragged map must hover over a closed folder in the map library before it opens. (0 to 10000) Restart required.
ui.libraryAutoExpandMs = 700
# Colour of walls in the DM view. (#RRGGBB)
ui.wallColor = #FF2A2A
# Opacity of walls in the DM view. (0 to 1)
ui.wallOpacity = 0.9
# Colour of open doors (line and badge) in the DM view. (#RRGGBB)
ui.doorOpenColor = #32CD32
# Colour of closed doors (line and badge) in the DM view. (#RRGGBB)
ui.doorClosedColor = #E0473C
# Colour of open windows (line and badge) in the DM view. (#RRGGBB)
ui.windowOpenColor = #32CD32
# Colour of closed windows (line and badge) in the DM view. (#RRGGBB)
ui.windowClosedColor = #E0473C
# Opacity of the grid lines. (0 to 1)
ui.gridOpacity = 0.08

# ---- Effect textures. Per texture: color and opacity (start values when picked), softEdges (fade out at the shape edge), and animated layers ----
# Effect textures: size of one texture tile in grid cells (smaller = finer pattern).
texture.tileCells = 4
# Width of the soft edge in grid cells.
texture.featherCells = 0.9
# Smoothness steps of the soft edge (1-24, more = smoother but slower).
texture.featherPasses = 8
