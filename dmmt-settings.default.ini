# Dungeon Master Map Tool settings
# Edit this file with any text editor. Lines are 'key = value'; lines starting with # are comments.
# Texture settings are picked up when the application window regains focus; everything else
# is read at startup. Delete a line to fall back to the built-in default. Invalid values are ignored.

# ---- Window and panels ----
# Show the sidebar (true/false).
ui.sidebarVisible = true
# Show the toolbar controls (true/false).
ui.controlsExpanded = true

# ---- Collapsible sidebar sections (true = expanded) ----
ui.section.tools.expanded = true
ui.section.fog.expanded = true
ui.section.lighting.expanded = true
ui.section.effects.expanded = true
ui.section.text.expanded = true
ui.section.building.expanded = true
ui.section.player.expanded = true
ui.section.performance.expanded = true

# ---- Player screen ----
# Index of the monitor used for the player view.
player.screenIndex = 0
# Physical size of one grid tile on the player screen, in inches.
player.tileInches = 1.0
# Screen diagonal per monitor index in inches, e.g. player.screenDiagonalInches.1 = 27.
# player.screenDiagonalInches.0 = 

# ---- Fog and lighting ----
# Fog cells per grid cell (edge sharpness of fog of war).
fog.cellsPerGrid = 10
# Strength of the light colour tint over lit areas (0-1).
lighting.tint = 0.08

# ---- Performance (frames per second, 1-240) ----
# Frame rate while interacting with the map.
render.targetFps = 60
# Frame rate while only effect textures or light flicker move (capped by targetFps).
render.animationFps = 30
# Frame rate when nothing moves and there was no input for a second.
render.idleFps = 10

# ---- Auto-save ----
# Save the project automatically (true/false).
autosave.enabled = true
# Minutes between automatic saves.
autosave.minutes = 2

# ---- Text defaults ----
# Default font size of new text labels.
text.fontSize = 32
# Default text colour.
text.textColor = #FFFFFF
# Default text background colour.
text.backgroundColor = #00000000
# Default text border colour.
text.borderColor = #00000000

# ---- Import ----
# Folder last used when importing a map image.
import.lastDirectory = 

# ---- Effect textures. Per texture: color and opacity (start values when picked), softEdges (fade out at the shape edge), and animated layers ----
# Effect textures: size of one texture tile in grid cells (smaller = finer pattern).
texture.tileCells = 4
# Width of the soft edge in grid cells.
texture.featherCells = 0.9
# Smoothness steps of the soft edge (1-24, more = smoother but slower).
texture.featherPasses = 8
# Texture 'smoke': default colour (#RRGGBB).
texture.smoke.color = #9A9A9A
#   default opacity (0.05-1).
texture.smoke.opacity = 0.75
#   fade out at the shape edge (true/false).
