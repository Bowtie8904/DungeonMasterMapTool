<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ranger companion runtime check</title></head>
<body><main id="host"></main><pre id="result">RUNNING</pre>
<script type="module">
import catalog from '../../dmmap-daggerheart/classes.json';
import { emptyCharacter } from '../src/daggerheart/data.ts';
import { applyCompanionTraining, companionRules, companionWeapon } from '../src/daggerheart/companion.ts';
import { renderSheetView, SheetBus } from '../src/daggerheart/view.ts';
import { openLevelUp, openMancer } from '../src/daggerheart/mancer.ts';
import '../src/daggerheart/sheet.css';
const result = document.querySelector('#result');
try {
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const c = emptyCharacter('Ranger');
  c.mancer.done = true; c.className = 'Ranger'; c.subclass = 'Beastbound'; c.hp.slots = 6;
  c.traits[0].spellcast = true; c.traits[0].mod = 2; c.proficiency.on = 3;
  c.experiences = [{ name: 'Owner only', mod: 7 }, { name: 'Hunter', mod: 2 }];
  c.features = catalog.entries.filter(e => e.id === 'ranger' || e.id === 'ranger-beastbound-foundation')
    .flatMap(e => e.features.map(f => ({ ...structuredClone(f), source: e.kind === 'class' ? 'Class feature - Ranger' : 'Subclass foundation - Beastbound' })));
  const host = document.querySelector('#host');
  const bus = new SheetBus();
  let sent, changed = 0, logged = '';
  const button = text => {
    const scope = [...document.querySelectorAll('.dh-wiz-backdrop, .dh-rolldlg-backdrop')].at(-1) ?? document.querySelector('dialog[open]') ?? document;
    return [...scope.querySelectorAll('button')].find(b => b.textContent === text || b.textContent.startsWith(text + ' (') || b.querySelector('b')?.textContent === text);
  };
  const choose = (select, value) => { select.value = value; select.dispatchEvent(new Event('change')); };
  const fill = (input, value) => { input.value = value; input.dispatchEvent(new Event('input')); };
  const draw = () => host.replaceChildren(renderSheetView({ character: c, bus, onChange: () => changed++, onShare: entry => { logged = entry.item.name; }, onLog: message => { logged = message; }, onRoll: request => { sent = request; return true; } }));
  draw();
  assert([...host.querySelectorAll('.tab')].slice(0, 3).map(b => b.textContent).join(',') === 'Character,Companion,Domain Cards', 'Wrong tab order');
  button('Companion').click();
  assert(host.querySelector('.pages').querySelectorAll('button').length === 1, 'Empty Companion tab is not just Create companion');
  const before = JSON.stringify(c);
  button('Create companion').click();
  button('x').click();
  assert(JSON.stringify(c) === before, 'Cancelled companion creation mutated owner');
  button('Create companion').click();
  fill(document.querySelector('.dh-wiz-body input[placeholder=Name]'), 'Ash');
  fill(document.querySelector('.dh-wiz-body input[placeholder^="e.g. wolf"]'), 'Wolf');
  button('Next').click();
  const experienceInputs = document.querySelectorAll('.dh-wiz-body input');
  fill(experienceInputs[0], 'Scout'); fill(experienceInputs[1], 'Loyal');
  button('Next').click();
  fill(document.querySelector('.dh-wiz-body input'), 'Bite');
  button('Magic damage').click();
  button('Next').click();
  button('Create companion').click();
  assert(c.companion.name === 'Ash' && c.companion.damageType === 'magic', 'Wizard did not create chosen companion');
  assert(c.companion.stress.slots === 3 && c.companion.evasion === 10, 'Wrong starting stats');
  const weaponSlot = host.querySelector('.companion-page .slot');
  assert(weaponSlot.querySelector('.share-icon') && weaponSlot.querySelector('.inventory-controls'), 'Companion attack lacks active weapon sharing/controls');
  weaponSlot.querySelector('.share-icon').click();
  assert(logged === 'Ash: Bite', 'Companion attack cannot be posted to chat');
  assert(weaponSlot.querySelector('.feat .rich').textContent === "Commands use your Spellcast trait. Attacks inherit your applicable benefits, including Ranger's Focus.", 'Wrong weapon feature guidance');
  assert(getComputedStyle(host.querySelector('.pips[data-kind="companion Stress"] .pip')).width === getComputedStyle(host.querySelector('.pips[data-kind="stress"] .pip')).width, 'Companion Stress pips do not match owner size');
  button('Command').click();
  let dialog = document.querySelector('.dh-rolldlg');
  assert(!dialog.textContent.includes('Owner only') && dialog.textContent.includes('Scout'), 'Command uses owner Experiences');
  choose(dialog.querySelector('select'), '0');
  button('Roll to chat').click();
  assert(sent.expression === '2d12+4' && sent.source.includes('companion') && sent.source.includes('spellcast'), 'Wrong command formula/context');
  assert(c.hope.on === 1 && sent.contributions.some(r => r.label.includes('Companion Experience')), 'Companion Experience did not spend owner Hope');
  button('Attack +2').click();
  dialog = document.querySelector('.dh-rolldlg');
  assert(dialog.textContent.includes('Ranger’s Focus'), 'Companion attack does not inherit Focus');
  button('Roll to chat').click();
  assert(sent.source.includes('attack') && sent.weapon === 'Ash: Bite', 'Companion attack lost weapon routing');
  c.hope.on = 3;
  assert(bus.damage(sent.weapon), 'Chat Damage cannot resolve companion attack');
  const holdThemOff = [...document.querySelectorAll('.dh-roll-option')].find(row => row.textContent.includes('Hold Them Off'));
  assert(holdThemOff, 'Hold Them Off is not a damage roll option');
  holdThemOff.querySelector('input').click();
  button('Roll to chat').click();
  assert(sent.expression === '3d6', 'Companion damage does not use owner Proficiency');
  assert(c.hope.on === 0, 'Hold Them Off did not spend three Hope');
  applyCompanionTraining(c, [{ id: 'light-in-the-dark' }, { id: 'creature-comfort' }], 2);
  bus.notify();
  const hope = host.querySelector('.companion-hope');
  assert(hope && host.querySelectorAll('.pips[data-kind=hope] button').length === 7 && hope.title.includes('Light in the Dark'), 'Special Hope slot missing');
  c.scars = 1; bus.notify();
  const scarredHope = host.querySelectorAll('.pips[data-kind=hope] button');
  assert(scarredHope[5].classList.contains('companion-hope') && scarredHope[6].classList.contains('scarred'), 'Companion Hope must precede scars');
  c.scars = 0;
  c.features.push(...catalog.entries.filter(e => e.id === 'ranger-beastbound-specialization' || e.id === 'ranger-beastbound-mastery')
    .flatMap(e => e.features.map(f => ({ ...structuredClone(f), source: `Subclass ${e.stage} - Beastbound` }))));
  bus.notify();
  button('Character').click();
  assert(button('Hold Them Off'), 'Hold Them Off normal action is missing');
  assert(!button('Battle-Bonded Evasion'), 'Battle-Bonded still has an activation');
  const oldConfirm = window.confirm; window.confirm = () => true;
  const damageTracks = JSON.stringify([c.hp, c.companion.stress, c.armorTrack]);
  window.confirm = () => { throw new Error('Loyal Friend must not request confirmation'); };
  button('Loyal Friend').click();
  window.confirm = () => true;
  assert(logged.includes('Loyal Friend') && c.usage['feat:Loyal Friend'].used === 1, 'Loyal Friend did not announce/spend its use');
  assert(!document.querySelector('dialog[open]') && JSON.stringify([c.hp, c.companion.stress, c.armorTrack]) === damageTracks, 'Loyal Friend changed damage or opened a dialog');
  button('Companion').click();
  assert(host.textContent.includes('Creature Comfort'), 'Learned feature missing');
  button('Take damage').click(); button('Apply').click();
  assert(c.companion.stress.on === 1, 'Companion damage did not mark one Stress');
  button('Take damage').click(); button('Apply').click();
  button('Take damage').click(); button('Apply').click();
  assert(c.companion.unavailable && button('Command').disabled && button('Damage').disabled, 'Unavailable companion can act');
  assert([...host.querySelectorAll('.pips[data-kind="companion Stress"] button')].every(b => b.disabled), 'Unavailable Stress can be cleared manually');
  window.confirm = oldConfirm;
  const realFetch = window.fetch;
  window.fetch = async input => {
    const category = String(input).split('/').at(-1);
    const data = category === 'classes' ? catalog : { entries: [] };
    return new Response(JSON.stringify(data), { status: 200 });
  };
  const fresh = emptyCharacter('Fresh');
  await openMancer(host, fresh, () => {});
  const classPick = [...document.querySelectorAll('.cho')].find(b => b.querySelector('b')?.textContent === 'Ranger');
  classPick.click(); button('Next').click();
  [...document.querySelectorAll('.cho')].find(b => b.querySelector('b')?.textContent === 'Beastbound').click();
  button('Next').click();
  assert(document.querySelector('.dh-wiz h2').textContent === 'Meet your companion', 'Initial Character Mancer skips companion setup');
  button('x').click();
  c.companion.unavailable = false; c.companion.stress.on = 0;
  await openLevelUp(host, c, () => {});
  fill(document.querySelector('.dh-wiz-body input'), 'Veteran');
  button('Next').click();
  const hpChoice = () => [...document.querySelectorAll('.cho')].find(b => b.querySelector('b')?.textContent.startsWith('Add a Hit Point slot'));
  hpChoice().click(); hpChoice().click();
  button('Next').click();
  assert(document.querySelector('.dh-wiz h2').textContent === 'Your companion learns too', 'Level-up misses companion milestone');
  fill(document.querySelector('.dh-wiz-body input'), 'Protector');
  button('Next').click();
  button('Intelligent').click();
  assert(!document.querySelector('.dh-wiz-body select'), 'Training still uses dropdowns');
  const description = document.querySelector('.dh-wiz-sec .rich');
  assert(getComputedStyle(description).textTransform === 'none', 'Training descriptions are uppercase');
  button('Protector').click();
  button('Next').click(); button('Next').click(); button('Next').click();
  button('Level up!').click();
  assert(c.level === 2 && c.companion.experienceStats[2].mod === 3, 'Milestone training did not apply to the new companion Experience');
  window.fetch = realFetch;
  const multiclass = emptyCharacter('Multiclass');
  multiclass.mancer.done = true; multiclass.className = 'Warrior'; multiclass.level = 7;
  multiclass.features = catalog.entries.find(e => e.id === 'ranger-beastbound-foundation').features
    .map(f => ({ ...structuredClone(f), source: 'Multiclass Ranger - Beastbound foundation' }));
  multiclass.levelUps = [{ level: 5, advancements: [{ type: 'multiclass', multiclass: { className: 'Ranger', subclass: 'Ranger: Beastbound', domain: 'Sage' } }] }];
  host.replaceChildren(renderSheetView({ character: multiclass, onChange: () => changed++ }));
  button('Companion').click(); button('Create companion').click();
  fill(document.querySelector('.dh-wiz-body input[placeholder=Name]'), 'Birch');
  fill(document.querySelector('.dh-wiz-body input[placeholder^="e.g. wolf"]'), 'Owl');
  button('Next').click();
  const multiclassExperiences = document.querySelectorAll('.dh-wiz-body input');
  assert(multiclassExperiences.length === 3, 'Deferred multiclass setup lost its milestone Experience');
  multiclassExperiences.forEach((input, i) => fill(input, `Experience ${i + 1}`));
  button('Next').click(); fill(document.querySelector('.dh-wiz-body input'), 'Talons');
  button('Next').click();
  button('Aware').click();
  button('Aware x1').click();
  assert(document.querySelector('.dh-wiz-note').textContent.includes('2 / 3'), 'Repeated training count missing');
  document.querySelector('button[aria-label="Remove one Aware"]').click();
  button('Light in the Dark').click();
  assert(button('Light in the Dark x1').disabled, 'Single-use training cap ignored');
  button('Resilient').click();
  assert(button('Vicious').disabled, 'Training allows too many selections');
  assert(!document.querySelector('.dh-wiz-body select'), 'Deferred training still uses dropdowns');
  button('Next').click(); button('Create companion').click();
  assert(multiclass.className === 'Warrior' && multiclass.companion.training.length === 3, 'Deferred companion setup changed owner or missed training');
  assert(multiclass.companion.evasion === 12 && multiclass.companion.stress.slots === 4 && multiclass.hope.slots === 7, 'Out-of-order deferred training failed');
  assert(changed > 0, 'Companion changes do not enter normal sheet persistence');
  result.textContent = 'PASS';
} catch (error) {
  result.textContent = `FAIL: ${error.stack}`;
  throw error;
}
</script></body></html>
