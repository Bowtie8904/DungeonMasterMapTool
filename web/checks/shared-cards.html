<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shared chat card regression check</title></head>
<body>
<output id="result">RUNNING</output>
<div id="preview" style="max-width:900px;margin:20px auto"></div>
<script type="module">
import '../src/style.css';
import '../src/daggerheart/sheet.css';
import { App } from '../src/app.ts';
import { mockCharacter } from '../src/daggerheart/data.ts';
import { renderSheetView } from '../src/daggerheart/view.ts';
import { renderSharedCard, INVENTORY_DRAG, waitForInventoryDrag } from '../src/shared-cards.ts';

const result = document.getElementById('result');
const preview = document.getElementById('preview');
const checks = [];
const assert = (condition, label) => { if (!condition) throw new Error(label); checks.push(label); };
const until = async (condition) => {
  const deadline = Date.now() + 2000;
  while (!condition()) {
    if (Date.now() > deadline) throw new Error('Timed out waiting for browser update');
    await new Promise(resolve => setTimeout(resolve, 10));
  }
};
let available = 2;
const requests = [];
window.fetch = async (url, options) => {
  requests.push({ url, body: options?.body ? JSON.parse(options.body) : undefined });
  return new Response(JSON.stringify({ available }), { status: 200, headers: { 'Content-Type': 'application/json' } });
};
try {
  const c = mockCharacter();
  const common = { cardId: 'card', actorId: 'source', actorName: 'Mara', available: 2 };
  const entries = [
    { category: 'feature', item: { ...c.features[0], automation: { actions: [{ id: 'use', label: 'Use feature' }] } } },
    { category: 'domain', item: { ...c.loadout[1], spellcast: 'Instinct', automation: { actions: [{ id: 'cast', label: 'Cast spell' }] } } },
    { category: 'weapon', item: c.carriedWeapons[1] },
    { category: 'armor', item: c.activeArmor },
    { category: 'item', item: c.inventory[3] },
  ];
  for (const entry of entries) {
    const node = renderSharedCard({ ...common, ...entry }, async () => {});
    node.style.maxWidth = '300px';
    preview.append(node);
    assert(node.textContent.includes(entry.item.name), `${entry.category}: name rendered`);
    const transferable = ['weapon', 'armor', 'item'].includes(entry.category);
    assert(node.querySelectorAll('button').length === (transferable ? 1 : 0), `${entry.category}: no feature action buttons`);
    assert(!node.querySelector('.actions, .act, .dh-rolldlg'), `${entry.category}: no sheet controls`);
  }
  const stock = preview.lastElementChild;
  const button = stock.querySelector('button');
  available = 0;
  stock.dispatchEvent(new Event('refresh-stock'));
  await until(() => button.disabled && stock.textContent.includes('0 remaining'));
  assert(button.disabled && stock.textContent.includes('0 remaining'), 'Exhaustion disables grabbing');
  available = 1;
  stock.dispatchEvent(new Event('refresh-stock'));
  await until(() => !button.disabled && stock.textContent.includes('1 remaining'));
  assert(!button.disabled && stock.textContent.includes('1 remaining'), 'Restocking enables grabbing');

  let shared;
  let saves = 0;
  const sheet = renderSheetView({
    character: c, actorId: 'source', onRoll: () => true,
    onShare: entry => { shared = entry; },
    onPrepareShare: async () => { saves++; },
  });
  preview.append(sheet);
  assert(sheet.querySelectorAll('.feat button.share-icon').length === c.features.length + c.heritage.length, 'All character features have subtle share icons');
  const tab = text => [...sheet.querySelectorAll('button')].find(button => button.textContent === text).click();
  tab('Domain Cards');
  assert(sheet.querySelectorAll('.dcard button.share-icon').length === c.loadout.length + c.vault.length, 'All domain cards have share icons');
  sheet.querySelector('.dcard button.share-icon').click();
  assert(shared.category === 'domain', 'Domain icon posts a domain description');
  tab('Equipment');
  assert(sheet.querySelectorAll('.inventory-draggable').length === c.activeWeapons.length + c.carriedWeapons.length + c.carriedArmor.length + 1,
    'Active and carried weapons and armor can be dragged');
  tab('Loot');
  assert(sheet.querySelectorAll('tr.inventory-draggable').length === c.inventory.length, 'All inventory entries can be dragged');
  const transfer = new DataTransfer();
  sheet.querySelector('tr.inventory-draggable').dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
  const payload = JSON.parse(transfer.getData(INVENTORY_DRAG));
  await waitForInventoryDrag(payload.token);
  assert(saves === 1 && payload.actorId === 'source' && payload.entry.category === 'item', 'Inventory drag waits for a source save');

  const appRoot = document.createElement('div');
  preview.append(appRoot);
  const app = new App(appRoot, () => {});
  app.conn = { isOpen: true, send: () => true };
  app.chatCards = true;
  app.sheetHandles.set('source', { character: c, save: { flush: async () => { saves++; } } });
  app.chatRecipient.value = 'dm';
  const chat = appRoot.querySelector('.chat-section');
  chat.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer }));
  await until(() => requests.some(request => request.url === '/api/chat-cards'));
  const posted = requests.find(request => request.url === '/api/chat-cards' && request.body?.actorId === 'source');
  assert(posted?.body.toId === 'dm' && posted.body.category === 'item', 'Dropping in real chat posts to the selected recipient');
  app.myActors = [{ id: 'one', name: 'Rook' }, { id: 'two', name: 'Mira' }];
  app.ensureSheet = async () => ({ save: { flush: async () => {}, refresh: async () => {} }, bus: { notify: () => {} } });
  const grabbing = app.grabCard({ ...common, ...entries[4] });
  const picker = document.querySelector('dialog.inventory-picker');
  assert(picker?.open, 'Multiple actors get a receiving-character picker');
  picker.querySelector('select').value = 'two';
  [...picker.querySelectorAll('button')].find(button => button.textContent === 'Grab one').click();
  await grabbing;
  assert(requests.some(request => request.url.endsWith('/card/grab') && request.body.actorId === 'two'), 'Grab targets the chosen owned character');
  app.chatCards = false;
  let unsupported = false;
  try { await app.shareEntry('source', entries[4]); } catch { unsupported = true; }
  assert(unsupported, 'Older hosts explicitly reject sharing instead of publishing a fallback');
  appRoot.remove();

  const frame = document.createElement('iframe');
  const tokenFromFrame = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('Source window did not prepare a drag')), 2000);
    const listener = event => {
      if (event.source !== frame.contentWindow || !event.data?.inventoryToken) return;
      window.removeEventListener('message', listener);
      clearTimeout(timer);
      resolve(event.data.inventoryToken);
    };
    window.addEventListener('message', listener);
  });
  frame.srcdoc = '<script type="module">import { prepareInventoryDrag } from "/src/shared-cards.ts"; const inventoryToken = prepareInventoryDrag(async () => { await new Promise(resolve => setTimeout(resolve, 50)); }); parent.postMessage({ inventoryToken }, parent.location.origin);<\/script>';
  preview.append(frame);
  await waitForInventoryDrag(await tokenFromFrame);
  assert(true, 'Cross-window inventory drags wait for the source window save');
  frame.remove();
  result.textContent = `PASS (${checks.length} checks): ${checks.join('; ')}`;
  document.title = 'PASS - shared chat cards';
} catch (error) {
  result.textContent = `FAIL: ${error.stack ?? error}`;
  document.title = 'FAIL - shared chat cards';
}
</script>
</body>
</html>
