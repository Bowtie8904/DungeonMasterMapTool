<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat attention regression</title></head>
<body><div id="app"></div><pre id="result" style="position:fixed;bottom:0;left:250px;z-index:100;background:#111;color:#fff"></pre>
<script type="module">
import '../src/style.css';
import { App } from '../src/app.ts';
import { defaultState } from '../src/protocol.ts';
import { mockCharacter } from '../src/daggerheart/data.ts';
import { SheetBus } from '../src/daggerheart/view.ts';

const checks = [];
const assert = (condition, name) => { if (!condition) throw Error(name); checks.push(name); };
const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
const result = document.getElementById('result');
let app;
try {
  app = new App(document.getElementById('app'), () => {});
  app.conn.stop();
  const sent = [];
  app.conn.send = command => { sent.push(command); return true; };
  const hello = { type: 'hello', protocol: 1, playerId: 'alice', playerName: 'Alex',
    campaignId: 'chat-check', paused: false, chatIdentity: true };
  app.handle(hello);
  assert(!sent.some(command => command.type === 'chatIdentity'), 'connecting never overwrites campaign identity');
  const identity = document.getElementById('chat-identity');
  app.handle({ type: 'roster', players: [{ playerId: 'alice', playerName: 'Alex', chatIdentity: 'Remembered', connections: 1, pingMs: 12 }] });
  assert(identity.value === 'Remembered', 'loads saved identity from host roster');
  identity.value = '  Rook  ';
  identity.form.dispatchEvent(new Event('submit', { cancelable: true }));
  assert(sent.at(-1).type === 'chatIdentity' && sent.at(-1).identity === 'Rook', 'sends trimmed identity');
  app.handle({ type: 'roster', players: [{ playerId: 'alice', playerName: 'Alex', chatIdentity: 'Rook', connections: 1, pingMs: 12 }] });
  assert(identity.value === 'Rook', 'host confirms saved campaign identity');
  assert(document.querySelector('.players-overlay').textContent.includes('Alex (Rook) (you)'), 'overlay keeps account name with identity');
  app.handle({ ...hello, chatIdentity: undefined });
  assert(identity.disabled && identity.form.querySelector('button').disabled, 'older hosts disable identity changes');
  app.handle(hello);
  app.handle({ type: 'roster', players: [{ playerId: 'alice', playerName: 'Alex', chatIdentity: 'Rook', connections: 1, pingMs: 12 }] });
  assert(identity.value === 'Rook', 'reconnect loads campaign identity without browser storage');
  app.conn.send = () => false;
  identity.value = 'Not saved';
  identity.form.dispatchEvent(new Event('submit', { cancelable: true }));
  assert(document.querySelector('.toast').textContent.includes('not saved'), 'disconnected save reports failure');
  app.conn.send = command => { sent.push(command); return true; };
  identity.value = '';
  identity.form.dispatchEvent(new Event('submit', { cancelable: true }));
  assert(sent.at(-1).identity === '', 'identity can be cleared');

  const message = n => ({ type: 'chat', id: n, ts: Date.now(), fromId: 'bob', from: 'Bob', text: `Message ${n}: reading history` });
  app.handle({ type: 'snapshot', seq: 1, state: defaultState() });
  for (let n = 1; n <= 40; n++) app.handle(message(n));
  await frame();
  const log = document.querySelector('.log');
  const latest = document.querySelector('.chat-latest');
  const chat = app.sectionButtons.get('chat');
  const bottom = () => Math.abs(log.scrollHeight - log.clientHeight - log.scrollTop) <= 8;
  assert(bottom(), 'initial chat follows new entries');
  app.handle(message(41));
  await frame();
  assert(bottom(), 'new messages follow while at bottom');
  log.scrollTop = 40;
  log.dispatchEvent(new Event('scroll'));
  app.handle(message(42));
  await frame();
  assert(log.scrollTop === 40 && !latest.classList.contains('hidden'), 'reading older messages preserves scroll and offers jump');
  document.querySelector('.entry:last-child').style.minHeight = '650px';
  await frame();
  assert(log.scrollTop === 40, 'late content resize does not interrupt history reading');
  app.showSection('settings');
  app.handle(message(43));
  assert(chat.classList.contains('has-unread') && chat.getAttribute('aria-label').includes('new messages'), 'closed chat marks icon accessibly');
  app.showSection('chat');
  await frame();
  assert(!chat.classList.contains('has-unread') && chat.getAttribute('aria-label') === 'Chat', 'opening chat clears unread dot');
  assert(log.scrollTop === 40, 'panel switches preserve older-message position');
  latest.click();
  await frame();
  assert(bottom() && latest.classList.contains('hidden'), 'jump returns to latest and resumes following');
  const last = document.querySelector('.entry:last-child');
  last.style.minHeight = '650px';
  await frame();
  assert(bottom(), 'late content resize follows bottom');
  app.handle({ type: 'roll', id: 100, ts: Date.now(), fromId: 'bob', from: 'Bob', expression: '1d6', rolls: [3], total: 3 });
  await frame();
  assert(bottom() && !chat.classList.contains('has-unread'), 'open chat follows rolls without unread notifications');
  app.myActors = [{ id: 'hero', name: 'Hero', ownerId: 'alice' }];
  const character = mockCharacter();
  const bus = new SheetBus();
  let loadSheet;
  app.ensureSheet = () => new Promise(resolve => {
    loadSheet = () => {
      app.sheetHandles.set('hero', { character, bus, save: () => {} });
      resolve();
    };
  });
  const ownRoll = id => ({ type: 'roll', id, ts: Date.now(), fromId: 'alice', from: 'Alex',
    actorId: 'hero', source: 'attack', weapon: 'Shortbow', kind: 'duality',
    expression: '2d12+2', rolls: [9, 4], total: 15 });
  app.handle(ownRoll(101));
  assert(bottom(), 'own roll initially scrolls before actions load');
  loadSheet();
  for (let i = 0; i < 5; i++) await Promise.resolve();
  log.dispatchEvent(new Event('scroll'));
  await frame();
  assert(document.querySelector('.entry:last-child .roll-actions button')?.textContent === 'Damage', 'own roll loads actual action buttons asynchronously');
  assert(bottom(), `own roll follows asynchronous buttons (gap ${log.scrollHeight - log.clientHeight - log.scrollTop}, following ${app.followChat})`);
  log.scrollTop = 40;
  log.dispatchEvent(new Event('scroll'));
  app.handle(ownRoll(102));
  loadSheet();
  await frame();
  assert(log.scrollTop === 40, 'own roll actions do not interrupt reading history');
  latest.click();
  await frame();
  app.showSection(null);
  app.handle(message(44));
  app.showSection('chat');
  await frame();
  assert(bottom(), 'hidden messages follow on reopening when previously at bottom');
  app.showSection(null);
  app.handle({ type: 'snapshot', seq: 2, state: { ...defaultState(), chatTail: [message(45)] } });
  assert(!chat.classList.contains('has-unread'), 'history snapshots do not create unread notifications');
  app.handle({ type: 'chatDeleted', id: 45, ts: app.log[0].m.ts + 1 });
  assert(app.log.length === 1, 'deletion matches timestamp as well as legacy reused id');
  app.handle({ type: 'chatDeleted', id: 45, ts: app.log[0].m.ts });
  assert(app.log.length === 0 && !document.querySelector('.entry'), 'DM deletion removes the rendered chat entry');
  assert(app.store.state.chatTail.length === 0, 'DM deletion removes cached snapshot history');
  assert(!chat.classList.contains('has-unread'), 'DM deletion never marks closed chat unread');
  assert(!document.querySelector('.chat-delete'), 'players have no delete control');
  result.textContent = `PASS (${checks.length})\n${checks.join('\n')}`;
} catch (error) {
  result.textContent = `FAIL: ${error.stack}`;
  console.error(error);
} finally {
  app?.dispose();
}
</script></body></html>
