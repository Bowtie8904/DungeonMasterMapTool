# App hover help and API / Stream Deck control picker descriptions, keyed by stable control id.
# Edit descriptions here, then rebuild and restart the application.
# Short key titles are configured separately in control-names.properties.
# Unmapped controls retain their live tooltip/accessibility text, then their display name.
# Dynamic audio.category.<id> and audio.effect.<id> retain live library descriptions
# unless an exact id is added here. Java properties escapes (e.g. \n) are supported.

# Tools
tools.select=Select and move: click doors and windows; drag lights, effects, text boxes, image layers and the player viewport. Right-click an element for options; Alt + mouse wheel adjusts each selected light's radius by 1 tile.
tools.ping=Ping (P): click the map to flash a marker for the players
tools.laser=Laser pointer (L): show a laser dot to the players that follows your cursor. Holding the middle mouse button does the same briefly with any tool. No other interaction while active.
tools.undo=Undo (Ctrl+Z)
tools.redo=Redo (Ctrl+Y)

# Fog
fog.enabled=Fog of war on/off: revealed areas are remembered while fog is off
fog.revealBrush=Reveal brush: paint to remove fog; Alt + mouse wheel over the map adjusts brush size.
fog.hideBrush=Fog brush: paint fog back over the map; Alt + mouse wheel over the map adjusts brush size.
fog.revealRect=Reveal area: drag a rectangle to remove fog
fog.hideRect=Fog area: drag a rectangle to cover the map with fog
fog.revealAll=Reveal the whole map
fog.hideAll=Cover the whole map with fog
fog.revealRoom=Reveal room: click inside a room to reveal it up to walls and doors; Shift+click covers it with fog again.
fog.brushSize=Fog brush size in tiles: Alt + mouse wheel over the map with a fog brush, Draw or Line adjusts the shared brush size.
fog.sharpness=Fog shadow edge sharpness (fog cells per tile, applies to all maps). Higher is smoother but uses more memory and CPU.
fog.fade=Animate fog appearing and disappearing for all maps
fog.softness=Soft fog edge width in tiles (0 = hard edge, applies to all maps)

# Lighting
lighting.torch=Place a torch light: click the map to add it
lighting.candle=Place a candle light: click the map to add it
lighting.campfire=Place a campfire light: click the map to add it
lighting.magic=Place a magic light: click the map to add it
lighting.remove=Remove the selected lights (Del): select lights first by clicking one or dragging a box around them.
lighting.flicker=Light flicker for all maps. Off = no light flickers; on = each light uses its own flicker setting. Independent of effect animations; always off in performance mode.
lighting.revealPersistent=Keep fog revealed by the selected lights, even after the lights are switched off. Select lights first by clicking one or dragging a box around them.
lighting.revealWhileLit=Reveal fog only while the selected lights are on and lighting it. Select lights first by clicking one or dragging a box around them.
lighting.revealNone=Do not reveal fog with the selected lights. Select lights first by clicking one or dragging a box around them.
lighting.day=Time of day: Day
lighting.dawn=Time of day: Dawn
lighting.dusk=Time of day: Dusk
lighting.night=Time of day: Night
lighting.on=Turn on the selected lights (select lights first by clicking one or dragging a box around them).
lighting.off=Turn off the selected lights (select lights first by clicking one or dragging a box around them).
lighting.ambient=Ambient brightness for the current time of day on this map (saved with the map). Raise it if Night is too dark without a light. Double-click to reset.
lighting.tint=Light colour tint strength on this map (saved with the map). Lower keeps the map's own colours; higher tints lit areas with the light colour. Double-click to reset.
lighting.brightCore=Bright core strength on this map (saved with the map). 0% is off; higher brightens the map art at each light's centre instead of covering it. Double-click to reset.

# Weather
weather.type=Ambient weather for this map, shown to DM and players above the map and below fog and text.
weather.intensity=Weather intensity (rain amount for thunderstorms, not lightning frequency). Double-click to reset.
weather.lightningInterval=Seconds between lightning strikes, with natural variation. Lower = more frequent; independent of rain intensity. Double-click to reset.

# Effects
effects.circle=Circle effect: drag from the centre outward to draw a round spell area.
effects.rectangle=Box effect: drag corner to corner to draw a rectangular spell area.
effects.brush=Freehand effect: paint a free-form spell area with the brush; Alt + mouse wheel over the map adjusts brush size.
effects.pen=Pen: draw a thin freehand line in the selected colour (no texture, ignores brush size).
effects.line=Line: drag to draw a straight line in the selected colour and brush size (no texture); Alt + mouse wheel over the map adjusts brush size.
effects.delete=Delete the selected effect (Del)
effects.clear=Remove all effects
effects.color=Effect colour (also changes the selected effect)
effects.opacity=Effect opacity
effects.players=Players see this effect: turn off for DM-only markings
effects.texture=Effect texture (also changes the selected effect). Picking one loads its default colour and opacity (smoke grey, fire red, water blue, ...); adjust both afterwards.
effects.border=Border around textured effects (off by default); also changes the selected effect.
effects.light=Effect emits light in its colour (visible when the map is dark); also changes the selected effect. Works for every texture; picking a texture applies its default from the settings file.
effects.animations=Animate effect textures and weather on all maps (light flicker has its own toggle in the Lighting section; turn off to improve performance).
effects.brushSize=Effect brush size in tiles: Alt + mouse wheel over the map with Draw, Line or a fog brush adjusts the shared brush size.

# Text
text.add=Text box: drag on the map to draw a text box and type; click a text box to edit it.
text.layer=Show/hide all text boxes (DM and player view); text is drawn below the fog
text.autoSize=Auto-size: the selected text box grows and shrinks to fit its text
text.players=Players see this text box: turn off for DM-only notes
text.delete=Delete the selected text box (Del)
text.size=Font size: applies to the selected text while typing, or to new text; with a text box selected it changes all of its text.
text.color=Text colour: applies to the selected text while typing, or to new text
text.rotateLeft=Rotate all text boxes 90 degrees counter-clockwise on the player view only (the DM view is not affected).
text.rotateRight=Rotate all text boxes 90 degrees clockwise on the player view only (the DM view is not affected).
text.background=Text box background colour (light grey by default)
text.noBackground=Remove the text box background
text.border=Text box border colour (transparent by default)
text.noBorder=Remove the text box border

# Map building
building.drawWall=Draw walls: drag to draw a wall that blocks light; snaps to half tiles, hold Shift for free placement.
building.eraseWall=Erase walls: click a wall to remove it
building.wallLayer=Show/hide the wall layer (wall lines, doors and windows) in the DM view; lights stay visible.
building.lock=Lock/unlock the image layer: while locked, map images cannot be selected, moved, resized or deleted.
building.snap=Snap image layers to half-tile steps while moving/resizing
building.addImage=Add an image layer (or drag image files onto the map). Move it with Select, resize at the corner.

# Player view
player.window=Open/close the player window on the selected screen
player.freeze=Freeze/unfreeze the entire player view while preparing changes in the DM view.
player.scaleTest=Show a 1-inch test square on the player screen for tile calibration
player.handout=Open the handout window to show images to the players
player.grid=Show grid over the player map (does not remove grid lines baked into the image).
player.gridOpacity=Grid opacity
player.screen=Screen used for the player window
player.diagonal=Diagonal of the player screen in inches
player.tileSize=Size of one map tile on the player screen in inches
player.zoom=Player view zoom for this map (saved with the map). 0 = calibrated tile size; Ctrl + mouse wheel over the map also adjusts it. Double-click to reset.

# Performance
performance.target=Target frame rate while interacting with the map
performance.animation=Frame rate while lights and effects animate without recent input
performance.idle=Frame rate when the map is idle with no animations or recent input

# UI, maps and levels
ui.library=Show/hide the map library
ui.performance=Performance mode: temporarily reduce rendering quality and frame rates without changing project data.
ui.settings=Open application settings
ui.controls=Collapse/expand the DM controls
ui.panelSettings=Settings: all options that are not part of the DM controls, including which tabs and controls are shown.
maps.previous=Switch back to the previous map; repeated presses alternate between the last two maps.
levels.down=One level down (Page Down)
levels.up=One level up (Page Up)
levels.manage=Manage levels: add, remove, rename and reorder
levels.select=Go to a level

# Audio transport and volumes
audio.previous=Previous music track
audio.play=Pause or resume all audio
audio.next=Next music track
audio.overlay=Open the audio overlay
audio.libraryWindow=Open the audio library window: import files, manage categories and cut clips
audio.musicPlay=Play or pause the music only
audio.stop=Stop the music (fades out)
audio.mute=Fade all audio to silence and back
audio.library=Open the audio library
audio.effectsPause=Play or pause the sound effects only
audio.effectsStop=Stop all sound effects (fades out)
audio.masterVolume=Master audio volume
audio.musicVolume=Music volume
audio.effectsVolume=Sound effects volume
